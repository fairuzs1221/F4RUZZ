<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; } body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f172a, #1e3a8a); } .login-container { width: 380px; padding: 35px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; backdrop-filter: blur(15px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); } .login-container h1 { text-align: center; color: white; margin-bottom: 10px; } .login-container p { text-align: center; color: #cbd5e1; margin-bottom: 30px; } .input-box { margin-bottom: 20px; } .input-box label { display: block; color: white; margin-bottom: 8px; font-size: 14px; } .input-box input { width: 100%; padding: 13px 15px; border: none; outline: none; border-radius: 10px; background: rgba(255, 255, 255, 0.9); font-size: 15px; } .input-box input:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4); } .forgot { text-align: right; margin-bottom: 20px; } .forgot a { color: #93c5fd; text-decoration: none; font-size: 14px; } .forgot a:hover { text-decoration: underline; } .login-button { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; } .login-button:hover { background: #1d4ed8; transform: translateY(-2px); } .register { text-align: center; margin-top: 25px; color: #cbd5e1; font-size: 14px; } .register a { color: #60a5fa; text-decoration: none; font-weight: bold; } .register a:hover { text-decoration: underline; } @media (max-width: 450px) { .login-container { width: 90%; padding: 25px; } }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back</h1>
        <p>Silakan login ke akun kamu</p>

        <form>

            <div class="input-box">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email"
                    required
                >
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <div class="forgot">
                <a href="#">Lupa password?</a>
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <div class="register">
            Belum punya akun?
            <a href="#">Daftar sekarang</a>
        </div>

    </div>

</body>
</html>
